[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traderlog"
version = "0.1.0"
description = "Captures what Indian traders post on X and reconstructs their trades"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
ingest = ["playwright>=1.44"]
breadth = ["requests>=2.31"]
dev = ["pytest>=8.0"]

[project.scripts]
traderlog-checks = "traderlog.checks.__main__:main"

[tool.setuptools]
# The package lives in this directory, not a src/ layout.
package-dir = {"traderlog" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["ui*", "data*", "design*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
